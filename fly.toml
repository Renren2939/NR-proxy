# app には Fly.io で作るアプリ名(世界で一意)を入れてください
app = "your-proxy-app-name"
primary_region = "nrt"

[build]

[env]
  PORT = "3000"
  # BLOCKED_DOMAINS = "example.com,example.org"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
